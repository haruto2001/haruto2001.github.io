<!doctype html>
<!-- Generated by scripts/build-pages.mjs. Do not edit directly. -->
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{pageTitle}}</title>
    <meta name="description" content="{{metaDescription}}">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="{{canonicalUrl}}">
    <link rel="alternate" hreflang="ja" href="{{jaCanonicalUrl}}">
    <link rel="alternate" hreflang="en" href="{{enCanonicalUrl}}">
    <link rel="alternate" hreflang="x-default" href="{{jaCanonicalUrl}}">
    <link rel="icon" type="image/x-icon" href="{{faviconIcoPath}}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{favicon16Path}}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{favicon32Path}}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{appleTouchIconPath}}">
    <link rel="manifest" href="{{manifestPath}}">
    <meta name="theme-color" content="{{themeColorLight}}" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="{{themeColorDark}}" media="(prefers-color-scheme: dark)">
    <meta property="og:site_name" content="{{siteName}}">
    <meta property="og:title" content="{{ogTitle}}">
    <meta property="og:description" content="{{metaDescription}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{canonicalUrl}}">
    <meta property="og:image" content="{{ogImageUrl}}">
    <meta property="og:locale" content="{{ogLocale}}">
    <meta property="og:locale:alternate" content="{{ogAlternateLocale}}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ogTitle}}">
    <meta name="twitter:description" content="{{metaDescription}}">
    <meta name="twitter:image" content="{{ogImageUrl}}">
    <script type="application/ld+json">{{personStructuredDataJson}}</script>
    <script>
      (() => {
        const storageKey = "homepage-theme";
        const themeIconPaths = {
          light: "{{themeLightIconPath}}",
          dark: "{{themeDarkIconPath}}",
        };
        let theme = null;

        try {
          const storedTheme = window.localStorage.getItem(storageKey);
          if (storedTheme === "light" || storedTheme === "dark") {
            theme = storedTheme;
          }
        } catch (error) {
          console.warn(error);
        }

        if (!theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          theme = "dark";
        }

        if (!theme) {
          theme = "light";
        }

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.setProperty(
          "--theme-toggle-icon-url",
          `url("${theme === "dark" ? themeIconPaths.light : themeIconPaths.dark}")`,
        );
      })();

      window.__initialHash = window.location.hash;
      if (window.__initialHash) {
        history.replaceState(null, "", `${window.location.pathname}${window.location.search}`);
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
    >
    <link rel="stylesheet" href="{{stylesPath}}">
    <script type="application/json" id="homepage-locale-data">{{localeDataJson}}</script>
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-locale-text="labels.skipToContent">{{skipToContentLabel}}</a>
    <header class="site-header">
      <div class="site-header-inner">
        <nav
          class="site-nav"
          aria-label="{{sectionNavigationLabel}}"
          data-locale-aria-label="labels.sectionNavigation"
        >
{{navigationButtons}}
        </nav>
        <div class="header-controls">
          <div class="inline-links header-language-switch">
            <a class="language-switch-link{{jaCurrentClass}}" data-language-switch="ja" href="{{jaHref}}"{{jaAriaCurrent}}>日本語</a>
            <a class="language-switch-link{{enCurrentClass}}" data-language-switch="en" href="{{enHref}}"{{enAriaCurrent}}>English</a>
          </div>
          <button
            type="button"
            class="theme-toggle"
            data-theme-toggle
            aria-label="{{themeToggleLabel}}"
          >
            <span class="theme-toggle-icon" aria-hidden="true"></span>
            <span class="sr-only" data-theme-toggle-label>{{themeToggleLabel}}</span>
          </button>
        </div>
      </div>
    </header>
    <div class="header-spacer" aria-hidden="true"></div>

    <div class="page-shell">
      <header class="hero">
        <div class="hero-main">
          <div class="hero-heading">
            <h1 class="name">{{name}}</h1>
            <img
              class="avatar-inline"
              src="{{avatarPath}}"
              alt="{{avatarAlt}}"
              data-locale-alt="labels.avatarAlt"
              width="435"
              height="434"
            >
          </div>
          <p class="affiliation">{{affiliation}}</p>
          <p class="position">{{position}}</p>
          <div class="hero-introduction prose">{{introductionHtml}}</div>
        </div>

        <div class="hero-meta">
          <div class="meta-card">
            <p class="meta-label" data-locale-text="labels.links">{{linksLabel}}</p>
            <div class="inline-links">{{linksHtml}}</div>
          </div>
        </div>
      </header>

      <main id="main-content" class="content" tabindex="-1">
{{contentSections}}
      </main>

      <footer class="footer">
        <p>{{updatedAtText}}</p>
      </footer>
    </div>

    <script type="module" src="{{scriptPath}}"></script>
  </body>
</html>
